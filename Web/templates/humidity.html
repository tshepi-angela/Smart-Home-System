{% extends "base.html" %}

{% block content %}
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow-x: hidden;
        min-height: 100vh;
        background: #0a1a2a;
    }

    .fullscreen-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("{{ url_for('static', filename='images/background.jpg') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(1px) hue-rotate(56deg);
        transform: scale(1.02);
        z-index: 0;
    }

    .soft-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
        z-index: 1;
        pointer-events: none;
    }

    .main-content {
        position: relative;
        z-index: 1;
        background: transparent;
        min-height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
    }

    .dashboard-container {
        width: 100%;
        max-width: 800px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    /* Welcome Header */
    .welcome-section {
        margin-bottom: 2rem;
        text-align: center;
    }

    .welcome-section h1 {
        color: white;
        font-size: 1.8rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
    }

    .welcome-section p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
    }

    /* Glass Display Card */
    .glass-display-card {
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 2.5rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .graph-viewport-box {
        width: 100%;
        margin: 1.5rem auto;
        border-radius: 20px;
        background: rgba(12, 16, 20, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .graph-element {
        max-width: 100%;
        height: auto;
        border-radius: 15px;
    }

    .dashboard-return-link {
        display: inline-block;
        color: #7fb3d5;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: 1rem;
        transition: color 0.2s ease;
    }

    .dashboard-return-link:hover {
        color: white;
    }
</style>

<div class="fullscreen-bg"></div>
<div class="soft-overlay"></div>

<div class="main-content">
    <div class="dashboard-container">
        <div class="welcome-section">
            <h1>HUMIDITY TRENDS</h1>
            <p>Moisture level monitoring and relative atmospheric diagnostics.</p>
        </div>

        <div class="glass-display-card">
            <div class="graph-viewport-box">
                {% if plot_url %}
                    <img class="graph-element" src="data:image/png;base64,{{ plot_url }}" alt="Humidity Graph">
                {% else %}
                    <p style="color: white; padding: 2rem;">Gathering sensor data...</p>
                {% endif %}
            </div>

            <a href="/dashboard" class="dashboard-return-link">← Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
